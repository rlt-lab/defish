name: build
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write  # create releases on tag push
jobs:
  ffmpeg:  # GPL FFmpeg built from pinned sources, so releases can ship its complete source
    strategy:
      matrix:
        include:
          - {target: macos, os: macos-latest}
          - {target: windows, os: ubuntu-latest}  # cross-compiled with mingw-w64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: ffmpeg/out
          key: ffmpeg-${{ matrix.target }}-${{ hashFiles('ffmpeg/build.sh') }}
      - if: steps.cache.outputs.cache-hit != 'true' && matrix.target == 'windows'
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 nasm pkg-config
      - if: steps.cache.outputs.cache-hit != 'true' && matrix.target == 'macos'
        run: brew install pkgconf
      - if: steps.cache.outputs.cache-hit != 'true'
        run: ffmpeg/build.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.target }}
          path: ffmpeg/out/
  build:
    needs: ffmpeg
    strategy:
      matrix:
        include:
          - {target: macos, os: macos-latest, exe: ffmpeg}
          - {target: windows, os: windows-latest, exe: ffmpeg.exe}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-${{ matrix.target }}
          path: ffmpeg/out
      - if: runner.os == 'macOS'
        run: chmod +x ffmpeg/out/ffmpeg  # artifacts drop the executable bit
      # Test the FFmpeg that ships (imageio-ffmpeg uses IMAGEIO_FFMPEG_EXE instead of its own binary).
      - run: uv run --python 3.13 --with imageio-ffmpeg python check.py
        env:
          IMAGEIO_FFMPEG_EXE: ${{ github.workspace }}/ffmpeg/out/${{ matrix.exe }}
      - run: uv run --python 3.13 --with pyinstaller --with pillow python build.py
      # Zip here, not via upload-artifact: its zips drop the .app's symlinks and executable bits.
      - if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/defish defish-macos.zip
      - if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/defish -DestinationPath defish-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: defish-${{ matrix.target }}
          path: defish-*.zip
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            defish-*.zip
            ffmpeg-source-*.tar.gz
          generate_release_notes: true
