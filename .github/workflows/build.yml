name: build
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write  # create releases on tag push
env:
  # Pinned together: releases attach the FFmpeg source matching the binary imageio-ffmpeg bundles (GPL).
  IMAGEIO_FFMPEG: imageio-ffmpeg==0.6.0
  FFMPEG_VERSION: '7.1'
jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --python 3.13 --with ${{ env.IMAGEIO_FFMPEG }} python -c "import imageio_ffmpeg as f; v = f.get_ffmpeg_version(); assert v == '${{ env.FFMPEG_VERSION }}', f'bundled ffmpeg is {v}, update FFMPEG_VERSION'"
      - run: uv run --python 3.13 --with ${{ env.IMAGEIO_FFMPEG }} python check.py
      - run: uv run --python 3.13 --with ${{ env.IMAGEIO_FFMPEG }} --with pyinstaller --with pillow python build.py
      # Zip here, not via upload-artifact: its zips drop the .app's symlinks and executable bits.
      - if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/defish defish-macos.zip
      - if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/defish -DestinationPath defish-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: defish-${{ matrix.os }}
          path: defish-*.zip
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: curl -fLO https://ffmpeg.org/releases/ffmpeg-${{ env.FFMPEG_VERSION }}.tar.xz
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            defish-*.zip
            ffmpeg-*.tar.xz
          generate_release_notes: true
